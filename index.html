<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baidu Medo A2A Healthcare</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            background: rgba(0,0,0,0.3);
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        h2 { font-weight: 300; margin-top: 0; }
        .status { 
            background: #4CAF50; 
            padding: 10px 20px; 
            border-radius: 50px; 
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
        }
        .spider { font-size: 4rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spider">🕷️</div>
        <h1>Baidu Medo A2A</h1>
        <h2>Healthcare Agent</h2>
        <p>الوكيل الطبي شغال ومتاح 24/7</p>
        <div class="status">● Online & Running</div>
    </div>
</body>
</html>
